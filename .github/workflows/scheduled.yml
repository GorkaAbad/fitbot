name: Scheduled FitBot run

on:
  # Runs Fri, Sat, Mon, Tue so that +3 days lands on Mon, Tue, Thu, Fri.
  # The bot logs in a minute before and books at exactly 18:15:00 Madrid.
  # 16:10 UTC = 18:10 Madrid (summer) / 17:10 Madrid (winter, cron is UTC so it starts an hour earlier).
  schedule:
  - cron: "10 16 * * 1,2,5,6"
  workflow_dispatch:
    inputs:
      wait:
        description: "Book at 18:15:00 Madrid (untick to book right away, for testing)"
        type: boolean
        default: true
      days-in-advance:
        default: "3"
      booking-goals:
        default: '{"0":{"time":"1815","name":"wod"},"1":{"time":"1815","name":"funcional"},"3":{"time":"1815","name":"strength"},"4":{"time":"1815","name":"wod"}}'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --no-dev
      - name: Run fitbot
        env:
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          PROXY: ${{ secrets.PROXY }}
          DAYS: ${{ inputs.days-in-advance || '3' }}
          BOOK_AT: ${{ (github.event_name == 'schedule' || inputs.wait) && '18:15:00' || '' }}
          GOALS: ${{ inputs.booking-goals || '{"0":{"time":"1815","name":"wod"},"1":{"time":"1815","name":"funcional"},"3":{"time":"1815","name":"strength"},"4":{"time":"1815","name":"wod"}}' }}
        run: >
          uv run --no-sync python src/main.py
          --email="$EMAIL"
          --password="$PASSWORD"
          --box-name=crossfitsanturtzi
          --box-id=10320
          --days-in-advance="$DAYS"
          --proxy="$PROXY"
          --booking-goals="$GOALS"
          --book-at="$BOOK_AT"
